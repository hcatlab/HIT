# hit stack
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hit
      POSTGRES_USER: hit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hit-server:
    image: ghcr.io/hcatlab/hit:latest
    environment:
      DATABASE_URL: postgresql://hit:${POSTGRES_PASSWORD}@postgres:5432/hit
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  hit-web:
    image: ghcr.io/hcatlab/hit-web:latest
    ports:
      - "127.0.0.1:${HIT_WEB_PORT:-8090}:80"
    depends_on:
      - hit-server
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

volumes:
  postgres-data:

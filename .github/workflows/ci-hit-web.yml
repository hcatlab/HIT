name: ci-hit-web

on:
  push:
    paths:
      - "hit-web/**"
      - ".github/workflows/ci-hit-web.yml"
  pull_request:
    paths:
      - "hit-web/**"
      - ".github/workflows/ci-hit-web.yml"

jobs:
  build-hit-web:
    name: Build hit-web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hit-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Elm formatting
        run: npx elm-format --validate src

      - name: Build
        run: npm run build

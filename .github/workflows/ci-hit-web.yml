name: ci-hit-web

on:
  push:
    paths:
      - "hit-web/**"
      - ".github/workflows/ci-hit-web.yml"
  pull_request:
    paths:
      - "hit-web/**"
      - ".github/workflows/ci-hit-web.yml"

jobs:
  build-hit-web:
    name: Build hit-web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hit-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Elm formatting
        run: npx elm-format --validate src

      - name: Build
        run: npm run build

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: build-hit-web
    environment: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: hit-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: hit-web
          file: hit-web/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
